<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study&amp;Go Compass</title>
</head>
<body>
<style>
/* Layout: a top bar over three flat panes split by hairlines. Left lists
   categories and goals, the centre stage holds the chrome Study&Go globe on a
   still liquid-chrome backdrop, right shows the selected goal.
   Look: steel blues on near-black navy, polished chrome for anything you
   act on, and warm gold for what is done. */
:root {
  color-scheme: dark;
  --ground: #060B1A;
  --panel: #0B1430;
  --hair: #1B2A52;
  --line: #2A3D70;
  --line-strong: #3D568F;
  --hover: #142044;
  --hover-soft: #111C3C;
  --seg: #0A1230;
  --track: #1B2A52;
  --tint: #18305F;
  --ink: #E9F1FC;
  --muted: #9DB2D6;
  --accent: #A9D0F7;
  --accent-hover: #C9E2FB;
  --accent-ink: #081433;
  --accent-dot: #0B1430;
  --mid: #6F9BD3;
  --progress-dot: #7FB0EA;
  --open-bg: #17233F;
  --open-ink: #C7D3EA;
  --open-dot: #8FA3C8;
  --gold: #F0C48C;
  --danger: #B8404B;
  --danger-hover: #A13540;
  --danger-text: #F2A0A8;
  --danger-bg: #331A1F;
  --danger-line: #5C2A31;
  --shadow: rgba(0, 0, 0, .55);
  --stage: #0A1330;
  --globe: #A9D0F7;
  --globe-done: #B2D1ED;
  --globe-done-sel: #DDEBFA;
  --globe-ink: #142654;
  --globe-text: #D6E5F8;
  --stage-text: #D3E3F8;
  --stage-muted: #A9C2E4;
  --sans: Inter, "Inter Display", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --serif: "Instrument Serif", "Sitka Heading", Georgia, serif;
}

html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--sans); font-size: 13px; line-height: 1.35; }
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, main:focus-visible { outline: 2px solid var(--mid); outline-offset: 1px; }
h1, h2, h3, p { margin: 0; }

.app { height: 100%; min-height: 600px; display: flex; flex-direction: column; overflow: hidden; background: var(--ground); }
.ico { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.sec { font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: .01em; }
.hair { height: 1px; background: var(--hair); flex: none; }
.note { font-size: 12.5px; line-height: 1.45; color: var(--muted); }

/* top bar */
.top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-height: 52px; padding: 8px 12px; border-bottom: 1px solid var(--hair); }
.brand { display: flex; align-items: center; gap: 9px; margin-right: 8px; }
.brand h1 { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
.brand span { font-size: 13px; color: var(--muted); }
.logo-bg { fill: var(--stage); }
.logo-g { fill: none; stroke: var(--globe); stroke-width: 1.6; stroke-linecap: round; transform: rotate(-23deg); transform-origin: 16px 16px; }
.grow { flex: 1 1 0; min-width: 8px; }
.search { position: relative; width: 220px; max-width: 100%; }
.search svg { position: absolute; left: 9px; top: 8px; color: var(--muted); }
.search .inp { padding-left: 30px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 30px; padding: 0 11px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font-weight: 500; cursor: pointer; white-space: nowrap; transition: background .15s ease, border-color .15s ease; }
.btn:hover { background: var(--hover-soft); }
.btn.primary { min-height: 36px; background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #FFFFFF; }
.btn.danger:hover { background: var(--danger-hover); border-color: var(--danger-hover); }
.btn.tall { min-height: 36px; }
.btn.block { width: 100%; }
.btn .ell { overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; flex: none; border-radius: 7px; border: 0; background: transparent; color: var(--muted); cursor: pointer; transition: background .15s ease, color .15s ease; }
.icon-btn:hover { background: var(--hover); color: var(--ink); }
.icon-btn.on { color: var(--ink); }
.inp { width: 100%; min-height: 30px; padding: 5px 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); color: var(--ink); transition: border-color .15s ease; }
.inp:hover { border-color: var(--line-strong); }
textarea.inp { resize: vertical; line-height: 1.45; }
.segs { display: inline-flex; padding: 2px; background: var(--seg); border-radius: 8px; }
.seg { display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; min-height: 26px; padding: 0 10px; border-radius: 6px; font-weight: 500; color: var(--muted); cursor: pointer; transition: background .15s ease, color .15s ease; }
.seg:hover { color: var(--ink); }
.seg.on { background: var(--panel); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.menuwrap { position: relative; }
.menu { position: absolute; top: 34px; left: 0; z-index: 21; min-width: 210px; max-height: 320px; overflow-y: auto; padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; box-shadow: 0 10px 28px var(--shadow); display: flex; flex-direction: column; gap: 1px; }
.mi { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 30px; padding: 4px 9px; border: 0; border-radius: 6px; background: transparent; color: var(--ink); text-align: left; cursor: pointer; }
.mi:hover { background: var(--hover-soft); }
.mi.on { background: var(--tint); }
.mi .mc { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* panes */
.cols { flex: 1 1 0; min-height: 0; display: flex; }
.side { width: 270px; flex: 0 0 270px; display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--hair); }
.side-cats { padding: 14px 10px 8px; display: flex; flex-direction: column; gap: 2px; max-height: 46%; overflow-y: auto; }
.side-cats .sec { padding: 0 8px 4px; }
#cats { display: flex; flex-direction: column; gap: 2px; }
.side-head { display: flex; align-items: baseline; justify-content: space-between; padding: 12px 18px 6px; }
.side-head span { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.side-goals { flex: 1 1 0; min-height: 0; overflow-y: auto; padding: 0 10px 8px; display: flex; flex-direction: column; gap: 1px; }
.side .hair { margin: 0 10px; }
.overall { padding: 12px 18px 16px; display: flex; flex-direction: column; gap: 8px; }
.big { display: flex; align-items: baseline; gap: 8px; font-family: var(--serif); font-variant-numeric: lining-nums; }
.big .n { font-size: 38px; line-height: 1; }
.big .of { font-size: 19px; color: var(--muted); }
.bar { height: 3px; border-radius: 2px; background: var(--track); overflow: hidden; }
.bar > div { height: 100%; border-radius: 2px; background: var(--accent); transition: width .3s ease; }
.overall .cap { font-size: 12px; color: var(--muted); }

.cat { display: block; width: 100%; padding: 8px 8px 7px; border: 0; border-radius: 8px; background: transparent; color: var(--ink); text-align: left; cursor: pointer; transition: background .15s ease; }
.cat:hover { background: var(--hover); }
.cat.on { background: var(--tint); }
.crow { display: flex; align-items: baseline; gap: 10px; }
.code { width: 18px; flex: none; font-size: 12px; color: var(--muted); }
.cname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ccount { font-size: 12px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.cbar { display: block; height: 3px; margin-top: 7px; border-radius: 2px; background: var(--track); overflow: hidden; }
.cfill { display: block; height: 100%; border-radius: 2px; background: var(--accent); }
.row { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 36px; padding: 5px 8px; border: 0; border-radius: 8px; background: transparent; color: var(--ink); text-align: left; cursor: pointer; transition: background .15s ease; }
.row:hover { background: var(--hover); }
.row.sel { background: var(--tint); }
.rt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rmeta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.badge { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; flex: none; border-radius: 50%; border: 1.5px solid var(--mid); font-size: 10px; font-weight: 700; letter-spacing: .02em; color: var(--ink); }
.badge.progress { background: var(--tint); }
.badge.done { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.row.sel .badge.progress, .lrow.sel .badge.progress { background: var(--panel); }

.mid { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; }
.stage { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.stage.map { background: var(--stage); position: relative; }
.stage.list { background: var(--panel); }
.globe-area { flex: 1 1 0; min-height: 0; margin: 14px 16px 6px; position: relative; z-index: 1; pointer-events: none; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#gl.hot { cursor: pointer; }
#gl.dragging { cursor: grabbing; }
#labels { position: absolute; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
.glabel { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 6px; max-width: 160px; padding: 2px; border-radius: 999px; background: rgba(5, 10, 26, .74); border: 1px solid rgba(169, 208, 247, .30); color: var(--ink); font-size: 11.5px; font-weight: 600; line-height: 1.2; white-space: nowrap; will-change: transform, opacity; }
.glabel.full { padding: 2px 9px 2px 2px; }
.glabel .gtag { flex: none; padding: 1px 6px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: 10.5px; font-weight: 700; letter-spacing: .03em; }
.glabel .gtitle { display: none; overflow: hidden; text-overflow: ellipsis; }
.glabel.full .gtitle { display: block; }
.glfail { position: absolute; inset: 0; z-index: 3; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; color: var(--stage-text); }
.legend { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 8px 16px 12px; font-size: 12px; color: var(--stage-text); }
.legend .keys { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.legend .keys span { display: inline-flex; align-items: center; gap: 7px; }
.legend .hintkeys { color: var(--stage-muted); }
.lg { width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid var(--globe); flex: none; }
.lg.open { background: rgba(174, 210, 248, .1); }
.lg.progress { background: rgba(174, 210, 248, .32); }
.lg.done { background: var(--globe-done); }
.status { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 6px 14px; border-top: 1px solid var(--hair); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* the globe itself is drawn by the WebGL engine further down */
.tip { position: absolute; z-index: 4; transform: translate(-50%, -100%) translateY(-18px); background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px; box-shadow: 0 10px 26px rgba(4, 9, 26, .5); pointer-events: none; opacity: 0; transition: opacity .15s ease; max-width: 270px; }
.tip.below { transform: translate(-50%, 0) translateY(18px); }
.tip.on { opacity: 1; }
.tip .tt { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tip .tm { font-size: 12px; color: var(--muted); white-space: nowrap; }

/* list view */
.lscroll { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
.lmin { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
.lgrid { display: grid; grid-template-columns: 44px minmax(0, 2.2fr) minmax(0, 1.7fr) minmax(0, 1.2fr) 104px 70px 88px 88px; align-items: center; column-gap: 12px; }
.lhead { padding: 10px 16px 8px; border-bottom: 1px solid var(--hair); font-size: 12px; font-weight: 500; color: var(--muted); }
.lrows { flex: 1 1 0; min-height: 0; overflow-y: auto; }
.lrow { width: 100%; min-height: 40px; padding: 0 16px; border: 0; border-bottom: 1px solid var(--hair); background: transparent; color: var(--ink); text-align: left; cursor: pointer; transition: background .15s ease; }
.lrow:hover { background: var(--hover-soft); }
.lrow.sel { background: var(--tint); }
.lrow .ellip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lrow .strong { font-weight: 500; }
.lrow .soft { color: var(--muted); }
.lrow .num { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }

/* detail */
.detail { width: 300px; flex: 0 0 300px; display: flex; flex-direction: column; min-height: 0; overflow-y: auto; background: var(--panel); border-left: 1px solid var(--hair); }
.blk { display: flex; flex-direction: column; gap: 10px; padding: 12px 16px 14px; }
.blk.tight { gap: 6px; }
.blk.rows { gap: 4px; padding: 10px 16px 14px; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pair { display: flex; gap: 8px; }
.pair > * { flex: 1 1 0; }
.stack { display: flex; flex-direction: column; gap: 5px; }
.title { font-size: 21px; line-height: 1.2; font-weight: 600; letter-spacing: -.01em; overflow-wrap: anywhere; }
.meta { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.body { color: var(--muted); line-height: 1.5; }
.notes { line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 10px 0 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.chip .cd { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.chip.open { background: var(--open-bg); color: var(--open-ink); }
.chip.open .cd { border: 1.5px solid var(--open-dot); }
.chip.progress { background: var(--tint); color: var(--ink); }
.chip.progress .cd { background: var(--progress-dot); }
.chip.done { background: var(--accent); color: var(--accent-ink); }
.chip.done .cd { background: var(--accent-dot); }
.checks { display: flex; flex-direction: column; gap: 1px; margin: 0 -6px 0 -4px; }
/* checklist: order is priority, the handle colour runs red (top) to blue (bottom) */
.ci { border-radius: 8px; }
.ci.dragging { background: var(--hover-soft); box-shadow: 0 6px 18px var(--shadow); }
.ci-row { display: flex; align-items: flex-start; gap: 4px; }
.ci-row .chk { flex: 1 1 0; min-width: 0; }
.grip { flex: none; width: 16px; height: 22px; margin-top: 4px; padding: 0; border: 0; border-radius: 5px; background: var(--p, var(--mid)); color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; cursor: grab; touch-action: none; }
.grip svg { fill: currentColor; }
.ci.is-done .grip { opacity: .5; }
.stepcount { flex: none; margin-top: 6px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.icon-btn.sm { width: 24px; height: 24px; margin-top: 3px; }
.fold svg { transition: transform .15s ease; }
.fold[aria-expanded="false"] svg { transform: rotate(-90deg); }
.steps { list-style: none; margin: 0 0 4px; padding: 0 0 0 20px; display: flex; flex-direction: column; }
.chk.step { padding: 3px 6px; font-size: 12.5px; gap: 8px; }
.sn { flex: none; min-width: 16px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.steprow { display: flex; align-items: center; gap: 2px; padding-left: 12px; }
.steprow .sn { width: 18px; font-size: 12px; margin-right: 4px; }
.note.small { font-size: 11.5px; }
body.dragging-ci { user-select: none; cursor: grabbing; }
body.dragging-ci .grip { cursor: grabbing; }
.chk { display: flex; align-items: flex-start; gap: 10px; padding: 5px 6px; border-radius: 6px; cursor: pointer; line-height: 1.4; transition: background .15s ease; }
.chk:hover { background: var(--hover-soft); }
.chk input { width: 15px; height: 15px; margin: 2px 0 0; flex: none; accent-color: var(--accent); cursor: pointer; }
.chk span { overflow-wrap: anywhere; }
.chk.done span { color: var(--muted); }
.kv { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 30px; }
.kv .v { font-variant-numeric: tabular-nums; }
.kv select { width: 144px; }
.hint { background: var(--tint); border-radius: 8px; padding: 9px 11px; font-size: 12.5px; line-height: 1.4; margin-top: 6px; }
.confirm { background: var(--danger-bg); border: 1px solid var(--danger-line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; font-size: 12.5px; line-height: 1.4; }
.err { color: var(--danger-text); font-size: 12px; font-weight: 600; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label, .field .lbl-t { font-size: 12px; font-weight: 500; color: var(--muted); }
.subrow { display: flex; align-items: center; gap: 2px; }
.recent { display: flex; flex-direction: column; margin: 0 -6px; }
.rrow { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; width: 100%; min-height: 28px; padding: 3px 6px; border: 0; border-radius: 6px; background: transparent; color: var(--ink); text-align: left; cursor: pointer; transition: background .15s ease; }
.rrow:hover { background: var(--hover-soft); }
.rrow .rd { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.mt { margin-top: 8px; }

/* ---------- liquid chrome theme ----------
   The supplied picture is the one still backdrop for the whole window.
   Header, side panels and footer are dark glass over it, with a fine mesh on
   top. Chrome blue is for what you act on; gold is for what is done. */
body { background: #050A1A; }

.app::after { content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none; background-image: radial-gradient(circle at 1px 1px, rgba(190, 215, 245, .07) 0.7px, rgba(190, 215, 245, 0) 1.1px); background-size: 3px 3px; }
.app > * { position: relative; z-index: 1; }
.app > .top { z-index: 3; }
.top { background: rgba(5, 10, 26, .50); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-bottom: 1px solid var(--hair); border-image: linear-gradient(90deg, rgba(127, 176, 234, 0), #7FB0EA 22%, #F0C48C 50%, #7FB0EA 78%, rgba(127, 176, 234, 0)) 1; }
.side, .detail { background: rgba(5, 10, 26, .58); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
.status { background: rgba(5, 10, 26, .62); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.stage.map { background: transparent; }
.stage.list { background: rgba(5, 10, 26, .58); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
.stage.map .legend { position: relative; z-index: 2; background: rgba(5, 10, 26, .46); }
.legend .right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.btn.mini { min-height: 26px; padding: 0 9px; font-size: 12px; background: rgba(5, 10, 26, .5); color: var(--stage-text); }
.btn.mini:hover { background: rgba(20, 32, 68, .8); }
.btn .dot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--muted); }
.btn[aria-pressed="true"] .dot { background: var(--accent); border-color: var(--accent); }
.lg { border-color: var(--globe); }
.lg.done { background: linear-gradient(180deg, #FBE7C8, #D9A050); border-color: var(--gold); }
.inp { background: rgba(8, 15, 36, .7); }
.btn { background: rgba(11, 20, 48, .7); }
.btn.primary { background: linear-gradient(180deg, #E4F0FC 0%, #A9CDF3 46%, #6C9AD2 54%, #BCD8F6 100%); border-color: #CFE3F8; color: var(--accent-ink); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .55), 0 6px 18px rgba(4, 9, 26, .5); }
.btn.primary:hover { background: linear-gradient(180deg, #F2F8FE 0%, #BFDBF7 46%, #7FA9DC 54%, #CFE4F9 100%); border-color: #E4F0FC; }
.btn.danger { background: var(--danger); }
.bar > div, .cfill { background: linear-gradient(90deg, #5E8FC8, #CFE3F8); }
.badge.done, .chip.done { background: linear-gradient(180deg, #FBE7C8, #D9A050); border-color: var(--gold); color: #2A1A05; }
.chip.done .cd { background: #2A1A05; }
.row.sel, .lrow.sel, .cat.on, .mi.on { box-shadow: inset 0 0 0 1px rgba(169, 208, 247, .55); }
.seg.on { background: linear-gradient(180deg, #213873, #152550); }
.big .n { background: linear-gradient(180deg, #F2F8FE 12%, #8FBBEB 58%, #F0C48C 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.ci.dragging { background: var(--hover); }

/* tags: three fixed ones; each gives its goal's cell a pulsing glow on the globe */
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tagbtn { min-height: 24px; padding: 0 9px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer; transition: background .15s ease, color .15s ease, border-color .15s ease; }
.tagbtn:hover { color: var(--ink); border-color: var(--line-strong); }
.tagbtn.on.t-important { background: rgba(255, 60, 48, .20); border-color: #FF5A4F; color: #FFC2BD; }
.tagbtn.on.t-due { background: rgba(255, 150, 144, .16); border-color: #FF9C96; color: #FFD6D3; }
.tagbtn.on.t-claude { background: rgba(255, 150, 40, .18); border-color: #FF9A2E; color: #FFD3A3; }
.tdot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.tdot.t-important { background: #FF4D42; box-shadow: 0 0 6px #FF4D42; }
.tdot.t-due { background: #FF9C96; box-shadow: 0 0 6px rgba(255, 156, 150, .7); }
.tdot.t-claude { background: #FF9A2E; box-shadow: 0 0 6px rgba(255, 154, 46, .8); }

/* mascot dock: an orange pixel helper at the bottom right of the detail panel */
.detail { overflow: hidden; }
.detail-body { flex: 1 1 0; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; }
.clawd { position: relative; flex: none; display: flex; justify-content: flex-end; padding: 2px 14px 10px; }
.clawd-btn { width: 128px; height: 72px; padding: 0; border: 0; border-radius: 6px; background: transparent; cursor: pointer; }
.clawd-btn canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
/* the talk bubble speaks in Claude Code's voice: a terminal card, monospace, clay orange */
.bubble { --cc-bg: #1F1E1D; --cc-ink: #ECE9E4; --cc-dim: #9A958E; --cc-clay: #D97757; --cc-ok: #7FBF8E; position: absolute; right: 12px; bottom: calc(100% - 2px); z-index: 6; width: 262px; padding: 10px 12px 11px; border-radius: 6px; background: var(--cc-bg); border: 1px solid var(--cc-clay); box-shadow: 0 12px 30px rgba(0, 0, 0, .6); color: var(--cc-ink); font-family: "Cascadia Code", "Cascadia Mono", Consolas, ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; line-height: 1.5; display: none; flex-direction: column; gap: 6px; }
.bubble::after { content: ""; position: absolute; right: 60px; bottom: -6px; width: 10px; height: 10px; background: var(--cc-bg); border-right: 1px solid var(--cc-clay); border-bottom: 1px solid var(--cc-clay); transform: rotate(45deg); }
.clawd:hover .bubble, .clawd:focus-within .bubble, .clawd.open .bubble { display: flex; }
.bubble .bq { margin: 0; font-weight: 600; }
.bubble .bq .star { color: var(--cc-clay); margin-right: 7px; }
.bubble .bq .ok { color: var(--cc-ok); margin-right: 7px; }
.bubble .bs { margin: 0; color: var(--cc-dim); overflow-wrap: anywhere; }
.bubble .opts { display: flex; flex-direction: column; margin-top: 2px; }
.bubble .opt { display: block; width: 100%; padding: 1px 0; border: 0; background: transparent; color: var(--cc-dim); font: inherit; text-align: left; white-space: pre; cursor: pointer; }
.bubble .opt.first, .bubble .opt:hover, .bubble .opt:focus-visible { color: var(--cc-clay); }
.bubble .opt:focus-visible { outline: 1px dashed var(--cc-clay); outline-offset: 1px; }
.bubble textarea { width: 100%; min-height: 96px; padding: 6px 8px; border: 1px solid #45413C; border-radius: 4px; background: #171615; color: var(--cc-ink); font: inherit; font-size: 12px; resize: vertical; }

/* tags in the list view */
.ltags { display: flex; flex-wrap: wrap; gap: 4px; padding: 5px 0; }
.tchip { padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); font-size: 11px; font-weight: 600; white-space: nowrap; }
.tchip.t-important { background: rgba(255, 60, 48, .20); border-color: #FF5A4F; color: #FFC2BD; }
.tchip.t-due { background: rgba(255, 150, 144, .16); border-color: #FF9C96; color: #FFD6D3; }
.tchip.t-claude { background: rgba(255, 150, 40, .18); border-color: #FF9A2E; color: #FFD3A3; }
/* side panels drag wider from their inner edge; they open at their normal size every time */
.side, .detail { position: relative; }

<script>
(function () {
  'use strict';

  var KEY = 'studyandgo-compass-v2';
  var SVGNS = 'http://www.w3.org/2000/svg';
  var ICONS = [
    'M12 3l9 5-9 5-9-5 9-5zM3 12.5l9 5 9-5M3 17l9 5 9-5',
    'M3 5h18v14H3zM3 9.5h18M6 7.3h.01M8.6 7.3h.01',
    'M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3zM4 7.5l8 4.5 8-4.5M12 12v9',
    'M3 6h6l2 2.5h10V19H3zM3 11h18',
    'M5 21V4M5 4h13l-3 4.5 3 4.5H5',
    'M13 3L5 13.5h6L10 21l8-10.5h-6L13 3z',
    'M12 3a9 9 0 100 18 9 9 0 000-18zM12 8a4 4 0 100 8 4 4 0 000-8z',
    'M5 4h12a2 2 0 012 2v14H7a2 2 0 01-2-2V4zM5 17h14'
  ];
  var STATUS = { open: 'Open', progress: 'In progress', done: 'Done' };
  var storageOk = true;

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function uid() { return 'g' + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36); }
  function fmt(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    var p = function (n) { return String(n).padStart(2, '0'); };
    return p(d.getDate()) + '-' + p(d.getMonth() + 1) + '-' + d.getFullYear();
  }

  /* ---------- storage: starts blank, nothing is seeded ---------- */
  function load() {
    var blank = { todos: [], view: 'map', sideOpen: true, detailOpen: true, autoTurn: true };
    try {
      var raw = window.localStorage.getItem(KEY);
      if (raw) {
        var d = JSON.parse(raw);
        if (d && Array.isArray(d.todos)) {
          return { todos: d.todos, view: d.view === 'list' ? 'list' : 'map', sideOpen: d.sideOpen !== false, detailOpen: d.detailOpen !== false, autoTurn: d.autoTurn !== false };
        }
      }
    } catch (e) { storageOk = false; }
    return blank;
  }
  function persist() {
    try {
      window.localStorage.setItem(KEY, JSON.stringify({ v: 2, todos: S.todos, view: S.view, sideOpen: S.sideOpen, detailOpen: S.detailOpen, autoTurn: S.autoTurn }));
      storageOk = true;
    } catch (e) { storageOk = false; }
  }

  var saved = load();
  var S = {
    todos: saved.todos, view: saved.view, sideOpen: saved.sideOpen, detailOpen: saved.detailOpen, autoTurn: saved.autoTurn,
    selId: null, selCell: null, hover: null, tip: null, pop: null,
    filter: 'all', query: '', draft: null, confirm: false, menu: false, clawd: false, clawdMsg: '', clawdText: ''
  };
  var SAVED_KEYS = { todos: 1, view: 1, sideOpen: 1, detailOpen: 1, autoTurn: 1 };
  var pendingFocus = null, scrolledFor = null, popTimer = null, formSig = '';

  function set(patch) {
    var save = false;
    Object.keys(patch).forEach(function (k) { S[k] = patch[k]; if (SAVED_KEYS[k]) save = true; });
    if (save) persist();
    render();
  }

  /* ---------- globe cells ----------
     The globe is a full sphere now: ten meridians by five usable bands, fifty
     cells, keyed "band-meridian". The list is the fill order, so new goals
     land on the cells that face you in the logo pose before the ones behind. */
  var GEO = (function () {
    var usable = [], byKey = {};
    [5, 4, 6, 3, 7, 2, 8, 1, 9, 0].forEach(function (l) {
      [2, 1, 3, 0, 4].forEach(function (b) {
        var c = { key: b + '-' + l, b: b, l: l, idx: b * 10 + l };
        usable.push(c);
        byKey[c.key] = c;
      });
    });
    return { usable: usable, byKey: byKey };
  })();
  /* goals saved against an older grid keep a place: any cell that no longer
     exists, or is taken twice, moves to the next free one */
  (function () {
    var used = {}, changed = false;
    S.todos.forEach(function (t) {
      if (t.cell == null) return;
      if (GEO.byKey[t.cell] && !used[t.cell]) used[t.cell] = true;
      else { t.cell = null; changed = true; }
    });
    S.todos.forEach(function (t) {
      if (t.cell != null) return;
      for (var i = 0; i < GEO.usable.length; i++) {
        var key = GEO.usable[i].key;
        if (!used[key]) { t.cell = key; used[key] = true; changed = true; break; }
      }
    });
    if (changed) persist();
  })();

  /* ---------- data helpers ---------- */
  function wrap(text, max) {
    var words = String(text).trim().split(/\s+/), lines = [''];
    words.forEach(function (w) {
      var cur = lines[lines.length - 1];
      if (!cur) lines[lines.length - 1] = w;
      else if ((cur + ' ' + w).length <= max) lines[lines.length - 1] = cur + ' ' + w;
      else lines.push(w);
    });
    var cut = function (l) { return l.length > max ? l.slice(0, max - 1) + '…' : l; };
    var out = [cut(lines[0]), lines.length > 1 ? cut(lines[1]) : ''];
    if (lines.length > 2 && out[1].charAt(out[1].length - 1) !== '…') {
      out[1] = (out[1].length > max - 1 ? out[1].slice(0, max - 1) : out[1]) + '…';
    }
    return out;
  }
  function catName(t) { return (t.cat && String(t.cat).trim()) || 'General'; }
  /* categories are whatever the goals use, in order of first appearance */
  function catList() {
    var names = [];
    S.todos.forEach(function (t) { var n = catName(t); if (names.indexOf(n) === -1) names.push(n); });
    var used = {};
    return names.map(function (name, i) {
      var pool = name.toUpperCase().replace(/[^A-Z0-9]/g, '') + 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', code = '#';
      for (var k = 0; k < pool.length; k++) if (!used[pool[k]]) { code = pool[k]; break; }
      used[code] = true;
      return { name: name, code: code, icon: ICONS[i % ICONS.length] };
    });
  }
  function activeFilter() {
    if (S.filter === 'all') return 'all';
    return S.todos.some(function (t) { return catName(t) === S.filter; }) ? S.filter : 'all';
  }
  function matches(t, filter) {
    if (filter !== 'all' && catName(t) !== filter) return false;
    var q = S.query.trim().toLowerCase();
    if (!q) return true;
    var hay = (t.title + ' ' + catName(t) + ' ' + tagList(t).map(function (g) { return g.name; }).join(' ') + ' ' + (t.notes || '') + ' ' + (t.subs || []).map(function (s) { return s.text + ' ' + stepsOf(s).map(function (x) { return x.text; }).join(' '); }).join(' ')).toLowerCase();
    return hay.indexOf(q) !== -1;
  }
  function current() {
    if (!S.selId) return null;
    return S.todos.find(function (t) { return t.id === S.selId; }) || null;
  }
  function nextFree() {
    var used = {};
    S.todos.forEach(function (t) { if (t.cell != null) used[t.cell] = true; });
    for (var i = 0; i < GEO.usable.length; i++) if (!used[GEO.usable[i].key]) return GEO.usable[i].key;
    return null;
  }
  /* tags, strongest first: when a goal carries more than one, its cell shows the first */
  var TAGS = [
    { id: 'important', name: '#Most important', lvl: 1 },
    { id: 'due', name: '#Due Soon', lvl: 2 },
    { id: 'claude', name: '#Give2Claude', lvl: 3 }
  ];
  function tagsOf(t) { return t.tags || []; }
  function tagList(t) { var ts = tagsOf(t); return TAGS.filter(function (g) { return ts.indexOf(g.id) !== -1; }); }
  function tagDots(t) { return tagList(t).map(function (g) { return '<span class="tdot t-' + g.id + '" title="' + esc(g.name) + '"></span>'; }).join(''); }
  function tagChips(t) { return tagList(t).map(function (g) { return '<span class="tchip t-' + g.id + '">' + esc(g.name) + '</span>'; }).join(''); }
  function toggleTag(id) {
    var cur = current();
    if (!cur) return;
    set({
      todos: S.todos.map(function (t) {
        if (t.id !== cur.id) return t;
        var ts = tagsOf(t).slice(), k = ts.indexOf(id);
        if (k === -1) ts.push(id); else ts.splice(k, 1);
        return Object.assign({}, t, { tags: ts });
      })
    });
  }
  function subsOf(t) { return t.subs || []; }
  function stepsOf(s) { return s.steps || []; }
  /* a subtask with steps is done when every step is */
  function subDone(s) { var st = stepsOf(s); return st.length ? st.every(function (x) { return x.done; }) : !!s.done; }
  function subTouched(s) { return subDone(s) || stepsOf(s).some(function (x) { return x.done; }); }
  function doneSubs(t) { return subsOf(t).filter(subDone).length; }
  /* position is priority: red at the top, amber in the middle, blue at the bottom */
  function prio(i, n) {
    var stops = [[194, 54, 43], [199, 125, 10], [95, 134, 196]];
    var t = n > 1 ? i / (n - 1) : 0;
    if (t >= 1) return 'rgb(' + stops[2].join(', ') + ')';
    var k = t * 2, lo = Math.floor(k), f = k - lo, a = stops[lo], b = stops[lo + 1];
    return 'rgb(' + [0, 1, 2].map(function (c) { return Math.round(a[c] + (b[c] - a[c]) * f); }).join(', ') + ')';
  }

  function model() {
    var cats = catList(), catBy = {};
    cats.forEach(function (c) { catBy[c.name] = c; });
    var filter = activeFilter();
    var counters = {}, labelOf = {}, ordOf = {}, byCell = {};
    S.todos.forEach(function (t) {
      var c = catBy[catName(t)];
      counters[c.name] = (counters[c.name] || 0) + 1;
      ordOf[t.id] = counters[c.name];
      labelOf[t.id] = c.code + counters[c.name];
      if (t.cell != null && GEO.byKey[t.cell]) byCell[t.cell] = t;
    });
    var shown = [];
    cats.forEach(function (c) { S.todos.forEach(function (t) { if (catName(t) === c.name && matches(t, filter)) shown.push(t); }); });
    var total = S.todos.length;
    return {
      cats: cats, catBy: catBy, filter: filter, counters: counters, labelOf: labelOf, ordOf: ordOf, byCell: byCell,
      filtering: filter !== 'all' || !!S.query.trim(), sel: current(), shown: shown, total: total,
      doneN: S.todos.filter(function (t) { return t.status === 'done'; }).length,
      progN: S.todos.filter(function (t) { return t.status === 'progress'; }).length
    };
  }

  /* ---------- actions ---------- */
  function pickTodo(id, show) {
    var t = S.todos.find(function (x) { return x.id === id; });
    if (!t) return;
    var patch = { selId: id, selCell: t.cell != null && GEO.byKey[t.cell] ? t.cell : null, draft: null, confirm: false, menu: false };
    if (show && !S.detailOpen) patch.detailOpen = true;
    set(patch);
  }
  function pickCell(key, show) {
    var t = S.todos.find(function (x) { return x.cell === key; });
    if (t) { pickTodo(t.id, show); return; }
    var patch = { selId: null, selCell: key, draft: null, confirm: false, menu: false };
    if (show && !S.detailOpen) patch.detailOpen = true;
    set(patch);
  }
  function move(dx, dy) {
    if (S.draft) return;
    if (S.view === 'list') {
      if (!dy) return;
      var rows = model().shown;
      if (!rows.length) return;
      var k = rows.findIndex(function (t) { return t.id === S.selId; });
      k = k === -1 ? 0 : Math.max(0, Math.min(rows.length - 1, k + dy));
      pickTodo(rows[k].id, false);
      return;
    }
    var cur = S.selCell != null ? GEO.byKey[S.selCell] : null;
    if (!cur) { pickCell(GEO.usable[0].key, false); return; }
    // one band up or down, one meridian left or right; the globe turns to follow
    pickCell(Math.max(0, Math.min(4, cur.b + dy)) + '-' + ((cur.l + dx + 10) % 10), false);
  }
  function startAdd(cell) {
    var free = (cell != null && GEO.byKey[cell] && !S.todos.some(function (t) { return t.cell === cell; })) ? cell : nextFree();
    var f = activeFilter();
    var last = S.todos.length ? catName(S.todos[S.todos.length - 1]) : '';
    pendingFocus = '#f-title';
    formSig = '';
    set({
      draft: { id: null, title: '', cat: f !== 'all' ? f : last, status: 'open', notes: '', subs: [{ id: uid(), text: '', done: false, steps: [] }], cell: free },
      selId: null, selCell: free, confirm: false, menu: false, detailOpen: true
    });
  }
  function startEdit() {
    var t = current();
    if (!t) return;
    pendingFocus = '#f-title';
    formSig = '';
    set({
      draft: { id: t.id, title: t.title, cat: catName(t), status: t.status, notes: t.notes || '', subs: subsOf(t).map(function (s) { return { id: s.id, text: s.text, done: !!s.done, fold: !!s.fold, steps: stepsOf(s).map(function (x) { return { id: x.id, text: x.text, done: !!x.done }; }) }; }), cell: t.cell },
      confirm: false, detailOpen: true
    });
  }
  function showErr(which) {
    var a = $('errTitle'), b = $('errCat');
    if (a) a.hidden = which !== 'title';
    if (b) b.hidden = which !== 'cat';
  }
  function saveDraft() {
    var d = S.draft;
    if (!d) return;
    var title = d.title.trim();
    if (!title) { showErr('title'); var e1 = $('f-title'); if (e1) e1.focus(); return; }
    var cat = String(d.cat || '').trim().replace(/\s+/g, ' ');
    if (!cat) { showErr('cat'); var e2 = $('f-cat'); if (e2) e2.focus(); return; }
    var same = catList().find(function (c) { return c.name.toLowerCase() === cat.toLowerCase(); });
    if (same) cat = same.name;
    var subs = d.subs.map(function (s) {
      var steps = stepsOf(s).map(function (x) { return { id: x.id, text: String(x.text || '').trim(), done: !!x.done }; }).filter(function (x) { return x.text; });
      return { id: s.id, text: s.text.trim(), done: steps.length ? steps.every(function (x) { return x.done; }) : !!s.done, fold: !!s.fold, steps: steps };
    }).filter(function (s) { return s.text; });
    var now = new Date().toISOString();
    var todos, id = d.id, cell = d.cell, pop = null;
    if (id) {
      todos = S.todos.map(function (t) {
        if (t.id !== id) return t;
        cell = t.cell;
        if (d.status === 'done' && t.status !== 'done') pop = t.cell;
        return Object.assign({}, t, { title: title, cat: cat, status: d.status, notes: d.notes, subs: subs, completed: d.status === 'done' ? (t.completed || now) : null });
      });
    } else {
      id = uid();
      if (cell == null || !GEO.byKey[cell] || S.todos.some(function (t) { return t.cell === cell; })) cell = nextFree();
      todos = S.todos.concat([{ id: id, title: title, cat: cat, status: d.status, notes: d.notes, subs: subs, cell: cell, created: now, completed: d.status === 'done' ? now : null }]);
      if (d.status === 'done') pop = cell;
    }
